name: EH-01 cross-layer error handling tests

on:
  push:
    branches: [feature/error-handling-audit]
  pull_request:
    branches: [main]

jobs:
  csv-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install script dependency
        run: python -m pip install pandas
      - name: Run CSV safety regression tests
        run: python -m unittest discover -s skills/data-analysis/tests -v
      - name: Install API dependencies
        run: python -m pip install -e "services/api[dev]" pytest pandas
      - name: Run API, incident analyzer, and original CSV regressions
        env:
          PYTHONPATH: services/api
        run: |
          python -m unittest discover -s services/api/tests -v
          python -m unittest discover -s scripts/tests -v
          python -m unittest discover -s skills/data-analysis/tests -v
      - name: Run dashboard async regressions
        run: node uis/backoffice/tests/dashboard.test.js
      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile skills/data-analysis/scripts/pandas_clean.py skills/data-analysis/tests/test_pandas_clean.py scripts/analyze.py scripts/tests/test_analyze.py services/api/app/main.py services/api/app/api/routes/incidents.py services/api/tests/test_incidents_api.py
          node --check uis/website/validation.js
          node --check uis/backoffice/dashboard.js
          node --check uis/backoffice/tests/dashboard.test.js
