name: EH-01 CSV safety tests

on:
  push:
    branches: [feature/error-handling-audit]
  pull_request:
    branches: [main]

jobs:
  csv-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install script dependency
        run: python -m pip install pandas
      - name: Run CSV safety regression tests
        run: python -m unittest discover -s skills/data-analysis/tests -v
      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile skills/data-analysis/scripts/pandas_clean.py skills/data-analysis/tests/test_pandas_clean.py
          node --check uis/website/validation.js
