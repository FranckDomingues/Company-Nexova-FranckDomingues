[project]
name = "nexova-incident-analysis-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
