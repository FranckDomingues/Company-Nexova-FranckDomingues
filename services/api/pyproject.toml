[project]
name = "nexova-api"
version = "0.1.0"
description = "Nexova centralized incident manager API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.uv.sources]
nexova-shared = { path = "../../packages/shared", editable = true }

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/shared"]
testpaths = ["tests"]
